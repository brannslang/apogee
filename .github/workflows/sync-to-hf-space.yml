name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Rewrite non-LFS binaries for Hugging Face's LFS-only policy
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git reset --hard HEAD
          git clean -fdx
          git lfs migrate import --include="docs/screenshots/*.png" --everything

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://brannslang:${HF_TOKEN}@huggingface.co/spaces/brannslang/apogee
          git push --force space HEAD:main
